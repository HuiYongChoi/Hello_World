<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Modern Web</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --primary-accent: #00f0ff;
            --secondary-accent: #ff003c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Gradient */
        .bg-gradient {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 240, 255, 0.08) 0%, rgba(255, 0, 60, 0.04) 30%, transparent 60%);
            animation: rotate 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Particles Canvas */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            cursor: pointer;
        }

        /* Simple overlay UI */
        .overlay {
            position: relative;
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        h1#title {
            visibility: hidden; /* Hidden but keeps space */
            font-size: 8rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            font-weight: 300;
            color: #a0a0a0;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1#title { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <canvas id="particles"></canvas>

    <div class="overlay">
        <h1 id="title">HELLO WORLD</h1>
        <p>Click anywhere to interact</p>
    </div>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        let mouse = {
            x: null,
            y: null,
            radius: 100
        }

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mousedown', function() {
            mouse.radius = 300; // Explode on click
        });

        window.addEventListener('mouseup', function() {
            mouse.radius = 100;
        });

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 2;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 40) + 5;
                this.color = Math.random() > 0.5 ? '#00f0ff' : '#ff003c';
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < mouse.radius) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 15;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 15;
                    }
                }
            }
        }

        function init() {
            particlesArray = [];
            
            // Draw text on temporary canvas to get pixel data
            const textCanvas = document.createElement('canvas');
            const textCtx = textCanvas.getContext('2d');
            textCanvas.width = canvas.width;
            textCanvas.height = canvas.height;
            
            let fontSize = canvas.width > 768 ? 130 : 70;
            textCtx.fillStyle = 'white';
            textCtx.font = `bold ${fontSize}px Outfit`;
            textCtx.textAlign = 'center';
            textCtx.textBaseline = 'middle';
            textCtx.fillText('HELLO WORLD', textCanvas.width / 2, textCanvas.height / 2);
            
            const data = textCtx.getImageData(0, 0, textCanvas.width, textCanvas.height);
            
            // Sample pixels (every 6th pixel for performance)
            const gap = 6;
            for (let y = 0; y < textCanvas.height; y += gap) {
                for (let x = 0; x < textCanvas.width; x += gap) {
                    if (data.data[(y * 4 * data.width) + (x * 4) + 3] > 128) {
                        particlesArray.push(new Particle(x, y));
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();

        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });
    </script>
</body>
</html>
